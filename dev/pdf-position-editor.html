<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Position Editor — Dev Tool</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
  background: #1a1a1e;
  color: #e0e0e0;
  height: 100vh;
  display: flex;
  overflow: hidden;
}

/* ===== LEFT PANEL ===== */
.left {
  flex: 1;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 24px;
  overflow: auto;
  background: #121215;
}

.image-wrap {
  position: relative;
  display: inline-block;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.06);
}

.image-wrap img {
  display: block;
  max-width: 100%;
  height: auto;
}

/* ===== DRAGGABLE LABELS ===== */
.field-label {
  position: absolute;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 700;
  font-family: monospace;
  background: rgba(25,184,242,0.85);
  color: #fff;
  border-radius: 4px;
  cursor: grab;
  user-select: none;
  white-space: nowrap;
  z-index: 10;
  transition: box-shadow 0.15s;
  letter-spacing: 0.3px;
  border: 1px solid rgba(255,255,255,0.2);
}

.field-label:hover {
  box-shadow: 0 0 0 2px rgba(25,184,242,0.5);
}

.field-label.dragging {
  cursor: grabbing;
  z-index: 20;
  box-shadow: 0 0 0 2px #f6b300;
  background: rgba(246,179,0,0.9);
}

.field-label.active {
  box-shadow: 0 0 0 2px #f6b300;
  background: rgba(246,179,0,0.9);
}

/* ===== RIGHT PANEL ===== */
.right {
  width: 340px;
  flex-shrink: 0;
  padding: 28px 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  background: #1e1e24;
  border-left: 1px solid rgba(255,255,255,0.06);
  overflow-y: auto;
}

.right h1 {
  font-size: 16px;
  font-weight: 700;
  color: #f6b300;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.right h2 {
  font-size: 13px;
  font-weight: 600;
  color: #888;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  margin-bottom: 4px;
}

.info-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}

.info-row span:first-child {
  font-size: 12px;
  color: #888;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

.info-row span:last-child {
  font-size: 14px;
  font-weight: 700;
  color: #fff;
  font-family: monospace;
}

.btn {
  width: 100%;
  padding: 10px 0;
  border: none;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: opacity 0.15s;
}

.btn:hover { opacity: 0.85; }
.btn:active { opacity: 0.7; }

.btn-save {
  background: #19b8f2;
  color: #fff;
}

.btn-reset {
  background: rgba(255,255,255,0.06);
  color: #ccc;
  border: 1px solid rgba(255,255,255,0.08);
}

.btn-export {
  background: #f6b300;
  color: #121215;
}

.export-area {
  background: #121215;
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 6px;
  padding: 14px;
  font-family: monospace;
  font-size: 12px;
  line-height: 1.6;
  color: #a0a0a0;
  white-space: pre-wrap;
  overflow: auto;
  max-height: 220px;
  word-break: break-all;
}

.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: #27ae60;
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  padding: 10px 24px;
  border-radius: 6px;
  opacity: 0;
  transition: opacity 0.25s;
  pointer-events: none;
  z-index: 100;
}

.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="left">
  <div class="image-wrap" id="imageWrap">
    <img id="templateImage" src="../assets/pdf/membership-template.png.png" alt="Template">
  </div>
</div>

<div class="right">
  <h1>PDF Position Editor</h1>

  <div>
    <h2>Selected Field</h2>
    <div class="info-row">
      <span>Field</span>
      <span id="selectedField">—</span>
    </div>
  </div>

  <div>
    <h2>Position</h2>
    <div class="info-row">
      <span>X</span>
      <span id="currentX">—</span>
    </div>
    <div class="info-row">
      <span>Y</span>
      <span id="currentY">—</span>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:8px;">
    <button class="btn btn-save" id="saveBtn">Save Position</button>
    <button class="btn btn-reset" id="resetBtn">Reset Position</button>
    <button class="btn btn-export" id="exportBtn">Export Coordinates</button>
  </div>

  <div>
    <h2>Exported Object</h2>
    <div class="export-area" id="exportArea">Click "Export Coordinates"</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  var FIELDS = [
    { id: 'firstName', label: 'Nom' },
    { id: 'lastName', label: 'Prénom' },
    { id: 'birthDate', label: 'Date de naissance' },
    { id: 'birthPlace', label: 'Lieu de naissance' },
    { id: 'cin', label: 'CIN' },
    { id: 'phone', label: 'Téléphone' },
    { id: 'address', label: 'Adresse' },
    { id: 'photo', label: 'Photo' },
  ];

  var wrap = document.getElementById('imageWrap');
  var img = document.getElementById('templateImage');
  var selectedFieldEl = document.getElementById('selectedField');
  var currentXEl = document.getElementById('currentX');
  var currentYEl = document.getElementById('currentY');
  var exportArea = document.getElementById('exportArea');
  var toast = document.getElementById('toast');

  var positions = {};
  var activeField = null;

  /* ---------- build default positions ---------- */
  function getDefaultPos() {
    var rect = wrap.getBoundingClientRect();
    var w = rect.width;
    var h = rect.height;
    return {
      firstName:  { x: Math.round(w * 0.08), y: Math.round(h * 0.28) },
      lastName:   { x: Math.round(w * 0.52), y: Math.round(h * 0.28) },
      birthDate:  { x: Math.round(w * 0.08), y: Math.round(h * 0.36) },
      birthPlace: { x: Math.round(w * 0.52), y: Math.round(h * 0.36) },
      cin:        { x: Math.round(w * 0.08), y: Math.round(h * 0.44) },
      phone:      { x: Math.round(w * 0.08), y: Math.round(h * 0.52) },
      address:    { x: Math.round(w * 0.08), y: Math.round(h * 0.60) },
      photo:      { x: Math.round(w * 0.72), y: Math.round(h * 0.28) },
    };
  }

  function initPositions() {
    positions = getDefaultPos();
  }
  initPositions();

  /* ---------- create draggable labels ---------- */
  function createLabels() {
    FIELDS.forEach(function (f) {
      var el = document.createElement('div');
      el.className = 'field-label';
      el.id = 'label-' + f.id;
      el.textContent = f.label;
      el.dataset.fieldId = f.id;

      var pos = positions[f.id];
      el.style.left = pos.x + 'px';
      el.style.top = pos.y + 'px';

      el.addEventListener('mousedown', function (e) {
        e.preventDefault();
        startDrag(e.clientX, e.clientY, el, f.id);
      });

      el.addEventListener('touchstart', function (e) {
        e.preventDefault();
        var t = e.touches[0];
        startDrag(t.clientX, t.clientY, el, f.id);
      }, { passive: false });

      wrap.appendChild(el);
    });
  }

  /* ---------- drag logic ---------- */
  var dragState = null;

  function startDrag(clientX, clientY, el, fieldId) {
    var rect = wrap.getBoundingClientRect();
    var offsetX = clientX - rect.left - el.offsetLeft;
    var offsetY = clientY - rect.top - el.offsetTop;

    dragState = { el: el, fieldId: fieldId, offsetX: offsetX, offsetY: offsetY };
    el.classList.add('dragging');
    setActive(fieldId);
  }

  function onMove(clientX, clientY) {
    if (!dragState) return;
    var rect = wrap.getBoundingClientRect();
    var x = clientX - rect.left - dragState.offsetX;
    var y = clientY - rect.top - dragState.offsetY;

    x = Math.max(0, Math.min(x, rect.width - dragState.el.offsetWidth));
    y = Math.max(0, Math.min(y, rect.height - dragState.el.offsetHeight));

    dragState.el.style.left = x + 'px';
    dragState.el.style.top = y + 'px';

    currentXEl.textContent = Math.round(x);
    currentYEl.textContent = Math.round(y);
  }

  document.addEventListener('mousemove', function (e) {
    onMove(e.clientX, e.clientY);
  });

  document.addEventListener('touchmove', function (e) {
    if (!dragState) return;
    e.preventDefault();
    var t = e.touches[0];
    onMove(t.clientX, t.clientY);
  }, { passive: false });

  function stopDrag() {
    if (!dragState) return;
    dragState.el.classList.remove('dragging');
    var x = parseInt(dragState.el.style.left, 10);
    var y = parseInt(dragState.el.style.top, 10);
    positions[dragState.fieldId] = { x: x, y: y };
    dragState = null;
  }

  document.addEventListener('mouseup', stopDrag);
  document.addEventListener('touchend', stopDrag);

  /* ---------- set active field ---------- */
  function setActive(fieldId) {
    document.querySelectorAll('.field-label.active').forEach(function (el) {
      el.classList.remove('active');
    });

    var el = document.getElementById('label-' + fieldId);
    if (el) el.classList.add('active');

    activeField = fieldId;
    selectedFieldEl.textContent = fieldId;

    var pos = positions[fieldId];
    if (pos) {
      currentXEl.textContent = pos.x;
      currentYEl.textContent = pos.y;
    }
  }

  /* ---------- click to select ---------- */
  FIELDS.forEach(function (f) {
    document.addEventListener('click', function (e) {
      var label = e.target.closest('.field-label');
      if (label && label.dataset.fieldId) {
        setActive(label.dataset.fieldId);
      }
    });
  });

  /* ---------- save ---------- */
  document.getElementById('saveBtn').addEventListener('click', function () {
    if (!activeField) { showToast('No field selected'); return; }
    var x = parseInt(currentXEl.textContent, 10);
    var y = parseInt(currentYEl.textContent, 10);
    if (isNaN(x) || isNaN(y)) return;
    positions[activeField] = { x: x, y: y };
    showToast('Saved ' + activeField + ' → (' + x + ', ' + y + ')');
  });

  /* ---------- reset ---------- */
  document.getElementById('resetBtn').addEventListener('click', function () {
    if (!activeField) { showToast('No field selected'); return; }
    var def = getDefaultPos();
    if (!def[activeField]) return;
    var p = def[activeField];
    positions[activeField] = { x: p.x, y: p.y };

    var el = document.getElementById('label-' + activeField);
    if (el) {
      el.style.left = p.x + 'px';
      el.style.top = p.y + 'px';
    }
    currentXEl.textContent = p.x;
    currentYEl.textContent = p.y;
    showToast('Reset ' + activeField);
  });

  /* ---------- export ---------- */
  function buildExportObject() {
    var out = {};
    FIELDS.forEach(function (f) {
      var p = positions[f.id];
      out[f.id] = { x: p ? p.x : 0, y: p ? p.y : 0 };
    });
    return out;
  }

  document.getElementById('exportBtn').addEventListener('click', function () {
    var data = buildExportObject();
    var code = 'const PDF_FIELDS = ' + JSON.stringify(data, null, 4) + ';';

    exportArea.textContent = code;

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(function () {
        showToast('Copied to clipboard');
      }, function () {
        fallbackCopy(code);
      });
    } else {
      fallbackCopy(code);
    }
  });

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      showToast('Copied to clipboard');
    } catch (_) {
      showToast('Copy failed — select manually');
    }
    document.body.removeChild(ta);
  }

  /* ---------- toast ---------- */
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(function () {
      toast.classList.remove('show');
    }, 2000);
  }

  /* ---------- init ---------- */
  createLabels();
  setActive('firstName');
})();
</script>
</body>
</html>
