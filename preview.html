<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>معاينة الاستمارة | الجمعية المغربية لهواة البحث والاستكشاف</title>
<meta name="description" content="معاينة استمارة الانخراط في الجمعية المغربية لهواة البحث والاستكشاف">
<meta name="author" content="الجمعية المغربية لهواة البحث والاستكشاف">
<link rel="shortcut icon" href="Amare%20files%20/logo.png" type="image/x-icon">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
:root {
  --m-primary: #123B78;
  --m-accent: #F6B300;
  --m-bg: #F7F9FC;
  --m-white: #FFFFFF;
  --m-text: #24324B;
  --m-border: rgba(18,59,120,.12);
  --m-shadow: 0 15px 40px rgba(18,59,120,.08);
  --m-radius: 24px;
  --m-btn-radius: 18px;
  --m-container: 1320px;
}

.preview-section {
  background: var(--m-bg) !important;
  padding: 80px 0 100px !important;
}

.preview-blobs { display: none !important; }

.preview-card {
  background: var(--m-white) !important;
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
  border: 1px solid var(--m-border) !important;
  border-radius: var(--m-radius) !important;
  padding: 40px 36px !important;
  box-shadow: var(--m-shadow) !important;
}

.preview-success-icon {
  background: var(--m-accent) !important;
  box-shadow: 0 12px 36px rgba(246,179,0,.25) !important;
  width: 72px;
  height: 72px;
  margin: 0 auto 20px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #0a1628;
  font-size: 34px;
  animation: mPreviewBounce 0.6s cubic-bezier(.22,.8,.32,1);
}

@keyframes mPreviewBounce {
  0% { transform: scale(0); }
  50% { transform: scale(1.15); }
  100% { transform: scale(1); }
}

.preview-pdf-container {
  border-radius: var(--m-radius) !important;
  border: 1px solid var(--m-border) !important;
  overflow: hidden;
  box-shadow: var(--m-shadow) !important;
}

.preview-btn {
  border-radius: var(--m-btn-radius) !important;
  font-family: 'Cairo', sans-serif !important;
  font-weight: 700 !important;
  gap: 10px !important;
  transition: transform .3s cubic-bezier(.22,.8,.32,1), box-shadow .3s ease !important;
}
.preview-btn:hover { transform: scale(1.02) !important; }
.preview-btn:active { transform: scale(.98) !important; }
.preview-btn-primary { background: var(--m-accent) !important; color: #0a1628 !important; box-shadow: 0 8px 24px rgba(246,179,0,.3) !important; }
.preview-btn-primary:hover { box-shadow: 0 12px 36px rgba(246,179,0,.45) !important; }
.preview-btn-accent { background: var(--m-primary) !important; color: #fff !important; box-shadow: 0 8px 24px rgba(18,59,120,.2) !important; }
.preview-btn-accent:hover { box-shadow: 0 12px 36px rgba(18,59,120,.3) !important; }
.preview-btn-navy { background: var(--m-primary) !important; color: #fff !important; box-shadow: 0 8px 24px rgba(18,59,120,.2) !important; }
.preview-btn-navy:hover { box-shadow: 0 12px 36px rgba(18,59,120,.3) !important; }
.preview-btn-ghost { border: 1.5px solid var(--m-border) !important; color: var(--m-text) !important; background: transparent !important; }
.preview-btn-ghost:hover { border-color: var(--m-primary) !important; background: rgba(18,59,120,.04) !important; }

@media (max-width: 768px) {
  .preview-section { padding: 60px 0 80px !important; }
  .preview-card { padding: 30px 24px !important; }
  .preview-btn { width: 100%; justify-content: center; }
}
@media (max-width: 480px) {
  .preview-card { padding: 24px 16px !important; }
  .preview-success-icon { width: 56px; height: 56px; font-size: 26px; }
}
</style>
</head>
<body>

<div id="loader" aria-hidden="true">
  <div class="loader-mark"></div>
  <div class="loader-text">الجمعية المغربية لهواة البحث والاستكشاف</div>
</div>

<a href="#preview-main" class="visually-hidden">تخطَّ إلى المحتوى الرئيسي</a>

<div id="navbar" data-base></div>

<main id="preview-main">

  <section class="preview-section">
    <div class="preview-blobs" aria-hidden="true">
      <div class="preview-blob preview-blob-1"></div>
      <div class="preview-blob preview-blob-2"></div>
    </div>

    <div class="container">
      <div class="preview-card" data-aos="fade-up" data-aos-duration="800">
        <div class="preview-success-icon">
          <i class="fas fa-check-circle"></i>
        </div>
        <h2 class="preview-success-title">تم إنشاء استمارة الانخراط بنجاح</h2>
        <p class="preview-success-desc">يمكنك الآن معاينة الاستمارة وتحميلها أو طباعتها.</p>
      </div>

      <div class="preview-pdf-wrap" data-aos="fade-up" data-aos-duration="800" data-aos-delay="150">
        <div class="preview-pdf-container" id="pdfContainer">
          <iframe id="pdfViewer" class="preview-pdf-iframe" src="" title="معاينة استمارة الانخراط"></iframe>
        </div>
      </div>

      <div class="preview-actions" data-aos="fade-up" data-aos-duration="800" data-aos-delay="250">
        <button class="preview-btn preview-btn-primary" id="viewBtn">
          <i class="fas fa-eye"></i>
          <span>معاينة PDF</span>
        </button>
        <button class="preview-btn preview-btn-accent" id="downloadBtn">
          <i class="fas fa-download"></i>
          <span>تحميل PDF</span>
        </button>
        <button class="preview-btn preview-btn-navy" id="printBtn">
          <i class="fas fa-print"></i>
          <span>طباعة الاستمارة</span>
        </button>
        <a href="Join us/index.html" class="preview-btn preview-btn-ghost">
          <i class="fas fa-arrow-right"></i>
          <span>العودة إلى صفحة الانخراط</span>
        </a>
      </div>
    </div>
  </section>

</main>

<div id="footer" data-base></div>

<button class="back-to-top" id="backToTop" aria-label="العودة إلى الأعلى">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 15l-6-6-6 6"/></svg>
</button>

<script src="js/component-loader.js"></script>
<script>
  loadComponent('#navbar', 'components/navbar.html');
  loadComponent('#footer', 'components/footer.html');
</script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="script.js"></script>
<script>
(function() {
  'use strict';

  if (typeof AOS !== 'undefined') {
    AOS.init({
      once: true,
      offset: 80,
      duration: 800,
      easing: 'cubic-bezier(0.22, 0.8, 0.32, 1)',
    });
  }

  const pdfBytesData = sessionStorage.getItem('amare_pdf_bytes');
  const pdfContainer = document.getElementById('pdfContainer');
  const pdfViewer = document.getElementById('pdfViewer');

  if (!pdfBytesData) {
    pdfContainer.innerHTML = '<div class="preview-empty"><i class="fas fa-exclamation-triangle"></i><p>لم يتم العثور على الاستمارة. يرجى العودة إلى صفحة الانخراط.</p><a href="Join us/index.html" class="preview-btn preview-btn-primary" style="margin-top:16px"><i class="fas fa-arrow-right"></i><span>العودة إلى صفحة الانخراط</span></a></div>';
    document.getElementById('viewBtn').style.display = 'none';
    document.getElementById('downloadBtn').style.display = 'none';
    document.getElementById('printBtn').style.display = 'none';
    return;
  }

  let pdfBlob = null;

  try {
    const byteCharacters = atob(pdfBytesData);
    const byteNumbers = new Array(byteCharacters.length);
    for (let i = 0; i < byteCharacters.length; i++) {
      byteNumbers[i] = byteCharacters.charCodeAt(i);
    }
    const byteArray = new Uint8Array(byteNumbers);
    pdfBlob = new Blob([byteArray], { type: 'application/pdf' });
    const url = URL.createObjectURL(pdfBlob);
    pdfViewer.src = url;
  } catch(e) {
    pdfContainer.innerHTML = '<div class="preview-empty"><i class="fas fa-exclamation-triangle"></i><p>حدث خطأ أثناء تحميل الاستمارة.</p><a href="Join us/index.html" class="preview-btn preview-btn-primary" style="margin-top:16px"><i class="fas fa-arrow-right"></i><span>العودة إلى صفحة الانخراط</span></a></div>';
    document.getElementById('viewBtn').style.display = 'none';
    document.getElementById('downloadBtn').style.display = 'none';
    document.getElementById('printBtn').style.display = 'none';
  }

  document.getElementById('viewBtn').addEventListener('click', function() {
    if (!pdfBlob) return;
    const url = URL.createObjectURL(pdfBlob);
    window.open(url, '_blank');
  });

  document.getElementById('downloadBtn').addEventListener('click', function() {
    if (!pdfBlob) return;
    const url = URL.createObjectURL(pdfBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'استمارة_الانخراط_AMARE.pdf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  document.getElementById('printBtn').addEventListener('click', function() {
    if (!pdfBlob) return;
    const url = URL.createObjectURL(pdfBlob);
    const printWindow = window.open(url, '_blank');
    if (printWindow) {
      printWindow.onload = function() {
        printWindow.print();
      };
    }
  });
})();
</script>
</body>
</html>
