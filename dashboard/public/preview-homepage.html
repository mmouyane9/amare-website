<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>معاينة الصفحة الرئيسية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Cairo', sans-serif; direction: rtl; color: #1a1a2e; background: #f8fafc; overflow-x: hidden; }

  /* Hero */
  .hero { position: relative; padding: 120px 20px 80px; text-align: center; min-height: 60vh; display: flex; align-items: center; justify-content: center; }
  .hero-bg { position: absolute; inset: 0; background-size: cover; background-position: center; z-index: 0; }
  .hero::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(10,14,38,.92), rgba(10,14,38,.78)); z-index: 1; }
  .hero-inner { position: relative; z-index: 2; max-width: 780px; }
  .hero-eyebrow { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,.1); color: #e2e8f0; font-size: 14px; font-weight: 600; padding: 8px 18px; border-radius: 50px; margin-bottom: 24px; backdrop-filter: blur(8px); }
  .hero-eyebrow::before { content: "●"; color: #f59e0b; font-size: 10px; }
  .hero-inner h1 { font-size: clamp(32px, 6vw, 64px); font-weight: 900; line-height: 1.35; color: #fff; margin-bottom: 20px; }
  .hero-inner h1 span { color: #f59e0b; display: inline; }
  .hero-inner p { font-size: 17px; line-height: 1.8; color: #cbd5e1; max-width: 600px; margin: 0 auto 32px; }
  .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .hero-actions a { display: inline-flex; align-items: center; gap: 6px; padding: 14px 28px; border-radius: 50px; font-size: 15px; font-weight: 700; text-decoration: none; transition: all .25s; }
  .hero-actions a.primary { background: #f59e0b; color: #0a0e26; }
  .hero-actions a.secondary { background: #fff; color: #0a0e26; }
  .hero-actions a.outline { background: transparent; color: #fff; border: 2px solid rgba(255,255,255,.3); }
  .hero-actions a:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.2); }
  .hero-actions a svg { width: 18px; height: 18px; flex-shrink: 0; }

  /* Sections */
  section { padding: 80px 20px; }
  .section-container { max-width: 1200px; margin: 0 auto; }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; color: #f59e0b; font-size: 14px; font-weight: 700; margin-bottom: 16px; }
  .eyebrow::before { content: "●"; font-size: 10px; }
  .section-title { font-size: clamp(28px, 4vw, 44px); font-weight: 800; line-height: 1.3; margin-bottom: 16px; }
  .section-desc { font-size: 16px; color: #64748b; max-width: 620px; margin-bottom: 40px; line-height: 1.7; }

  /* About */
  .about-body { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; }
  .about-text { color: #475569; line-height: 1.9; margin-bottom: 16px; font-size: 15px; }
  .about-features { list-style: none; display: grid; gap: 16px; margin: 20px 0; }
  .about-feature { display: flex; gap: 14px; align-items: flex-start; }
  .about-ficon { width: 44px; height: 44px; border-radius: 12px; background: #fef3c7; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .about-ficon svg { width: 20px; height: 20px; color: #f59e0b; }
  .about-ftitle { font-weight: 700; font-size: 15px; display: block; margin-bottom: 4px; }
  .about-fdesc { color: #64748b; font-size: 13px; }
  .about-actions { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
  .about-actions a { display: inline-flex; align-items: center; gap: 6px; padding: 12px 24px; border-radius: 50px; font-size: 14px; font-weight: 700; text-decoration: none; transition: all .2s; }
  .about-actions a.primary { background: #f59e0b; color: #0a0e26; }
  .about-actions a.outline { background: transparent; color: #0a0e26; border: 2px solid #e2e8f0; }
  .about-visual img { width: 100%; border-radius: 24px; object-fit: cover; max-height: 400px; }
  .about-stats { display: flex; gap: 32px; margin-top: 28px; }
  .about-stat-num { font-size: 36px; font-weight: 900; color: #0a0e26; }
  .about-stat-lbl { font-size: 13px; color: #64748b; }

  /* Features Grid */
  .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 40px; }
  .feature-card { background: #fff; border-radius: 20px; padding: 28px 24px; border: 1px solid #f1f5f9; transition: all .3s; }
  .feature-card:hover { box-shadow: 0 8px 30px rgba(0,0,0,.06); border-color: #e2e8f0; }
  .feature-card h3 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .feature-card p { font-size: 14px; color: #64748b; line-height: 1.7; }

  /* Activities Grid */
  .activities-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; margin-top: 40px; }
  .activity-card { background: #fff; border-radius: 20px; overflow: hidden; border: 1px solid #f1f5f9; transition: all .3s; }
  .activity-card:hover { box-shadow: 0 8px 30px rgba(0,0,0,.06); }
  .activity-card img { width: 100%; height: 200px; object-fit: cover; }
  .activity-card-body { padding: 20px; }
  .activity-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .activity-desc { font-size: 14px; color: #64748b; line-height: 1.7; margin-bottom: 12px; }
  .activity-link { color: #f59e0b; font-weight: 700; font-size: 14px; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }

  /* News Grid */
  .news-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; margin-top: 40px; }
  .news-card { background: #fff; border-radius: 20px; overflow: hidden; border: 1px solid #f1f5f9; }
  .news-card img { width: 100%; height: 200px; object-fit: cover; }
  .news-card-body { padding: 20px; }
  .news-meta { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; font-size: 12px; }
  .news-badge { background: #fef3c7; color: #92400e; padding: 3px 10px; border-radius: 6px; font-weight: 600; font-size: 11px; }
  .news-date { color: #94a3b8; }
  .news-card h3 { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
  .news-more { color: #f59e0b; font-weight: 700; font-size: 14px; text-decoration: none; }

  /* CTA / Store */
  .cta-section { background: linear-gradient(135deg, #0a0e26, #1e2944); color: #fff; padding: 80px 20px; text-align: center; position: relative; overflow: hidden; }
  .cta-section .store-title { font-size: clamp(28px, 4vw, 44px); font-weight: 800; margin-bottom: 16px; }
  .cta-section .store-desc { font-size: 16px; color: #94a3b8; max-width: 600px; margin: 0 auto 32px; line-height: 1.7; }
  .cta-section .store-btn { display: inline-flex; align-items: center; gap: 8px; padding: 14px 32px; border-radius: 50px; background: #f59e0b; color: #0a0e26; font-size: 16px; font-weight: 700; text-decoration: none; transition: all .25s; }
  .cta-section .store-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.3); }
  .cta-image { max-width: 400px; margin: 40px auto 0; }
  .cta-image img { width: 100%; border-radius: 20px; }

  /* Newsletter */
  .newsletter-section { background: #f8fafc; text-align: center; }
  .newsletter-section h2 { font-size: clamp(24px, 3vw, 36px); font-weight: 800; margin-bottom: 12px; }
  .newsletter-section p { font-size: 15px; color: #64748b; margin-bottom: 24px; }
  .newsletter-section form { display: flex; gap: 12px; max-width: 480px; margin: 0 auto; }
  .newsletter-section input { flex: 1; padding: 14px 20px; border-radius: 50px; border: 2px solid #e2e8f0; font-family: 'Cairo', sans-serif; font-size: 14px; }
  .newsletter-section button { padding: 14px 32px; border-radius: 50px; background: #0a0e26; color: #fff; border: none; font-family: 'Cairo', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; }

  /* Footer */
  .preview-footer { background: #0a0e26; color: #fff; padding: 60px 20px 0; }
  .footer-brand img { height: 50px; margin-bottom: 12px; }
  .brand-name { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
  .footer-about p { font-size: 14px; color: #94a3b8; line-height: 1.7; max-width: 300px; }
  .footer-bottom { border-top: 1px solid rgba(255,255,255,.1); padding: 20px; text-align: center; font-size: 13px; color: #94a3b8; margin-top: 40px; }

  /* Badge */
  .status-badge { position: fixed; top: 12px; left: 12px; z-index: 9999; background: rgba(245,158,11,.9); color: #0a0e26; padding: 6px 16px; border-radius: 50px; font-size: 12px; font-weight: 700; }
  .status-badge.draft { background: rgba(148,163,184,.9); }

  /* Responsive */
  @media (max-width: 768px) {
    .about-body { grid-template-columns: 1fr; }
    .hero { min-height: 50vh; padding: 80px 16px 60px; }
    section { padding: 60px 16px; }
  }
</style>
</head>
<body>

<div id="statusBadge" class="status-badge">معاينة</div>

<!-- Hero -->
<section class="hero" id="home">
  <div class="hero-bg"></div>
  <div class="hero-inner" id="preview-hero"></div>
</section>

<!-- About -->
<section class="about" id="about">
  <div class="section-container" id="preview-about"></div>
</section>

<!-- Features -->
<section class="features" id="features">
  <div class="section-container" id="preview-features"></div>
</section>

<!-- Activities -->
<section class="activities" id="services">
  <div class="section-container" id="preview-activities"></div>
</section>

<!-- News -->
<section class="news" id="news">
  <div class="section-container" id="preview-news"></div>
</section>

<!-- Store CTA -->
<div id="preview-store" class="cta-section"></div>

<!-- Newsletter CTA -->
<div id="preview-newsletter" class="newsletter-section section"></div>

<!-- Footer -->
<div id="preview-footer" class="preview-footer"></div>

<script>
  function esc(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function renderHero(d) {
    var html = '';
    var eyebrow = d.eyebrow || d.subheading || '';
    if (eyebrow) html += '<span class="hero-eyebrow">' + esc(eyebrow) + '</span>';

    var heading = d.heading || '';
    var lines = heading.split('\n');
    var headingHtml = '';
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (!line) continue;
      if (i === lines.length - 1) headingHtml += '<span>' + esc(line) + '</span>';
      else { if (headingHtml) headingHtml += '<br>'; headingHtml += esc(line); }
    }
    html += '<h1>' + headingHtml + '</h1>';

    if (d.description) html += '<p>' + esc(d.description) + '</p>';

    if (Array.isArray(d.buttons) && d.buttons.length > 0) {
      html += '<div class="hero-actions">';
      for (var j = 0; j < d.buttons.length; j++) {
        var b = d.buttons[j];
        if (!b.label) continue;
        html += '<a href="' + esc(b.url || '#') + '" class="' + esc(b.variant || 'primary') + '">' + esc(b.label) + '</a>';
      }
      html += '</div>';
    }

    document.getElementById('preview-hero').innerHTML = html;

    if (d.backgroundImage) {
      var bg = document.querySelector('.hero-bg');
      if (bg) bg.style.backgroundImage = 'url(' + d.backgroundImage + ')';
    }
  }

  function renderAbout(d) {
    var html = '';
    if (d.eyebrow) html += '<span class="eyebrow">' + esc(d.eyebrow) + '</span>';
    if (d.heading) {
      var hl = d.headingHighlight || '';
      html += '<h2 class="section-title">' + esc(d.heading) + ' <span style="color:#f59e0b">' + esc(hl) + '</span></h2>';
    }
    if (d.description) html += '<p class="section-desc">' + esc(d.description) + '</p>';

    html += '<div class="about-body"><div>';
    if (Array.isArray(d.paragraphs)) {
      for (var p = 0; p < d.paragraphs.length; p++) {
        html += '<p class="about-text">' + esc(d.paragraphs[p]) + '</p>';
      }
    }

    if (Array.isArray(d.features) && d.features.length > 0) {
      html += '<ul class="about-features">';
      for (var f = 0; f < d.features.length; f++) {
        html += '<li class="about-feature"><span class="about-ficon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg></span><div class="about-ftext"><span class="about-ftitle">' + esc(d.features[f].title) + '</span><span class="about-fdesc">' + esc(d.features[f].description) + '</span></div></li>';
      }
      html += '</ul>';
    }

    if (Array.isArray(d.buttons) && d.buttons.length > 0) {
      html += '<div class="about-actions">';
      for (var b = 0; b < d.buttons.length; b++) {
        html += '<a href="' + esc(d.buttons[b].url || '#') + '" class="' + esc(d.buttons[b].variant || 'primary') + '">' + esc(d.buttons[b].label) + '</a>';
      }
      html += '</div>';
    }
    html += '</div>';

    if (d.image && d.image.url) {
      html += '<div class="about-visual"><img src="' + esc(d.image.url) + '" alt="' + esc(d.image.alt || '') + '" class="about-img"></div>';
    }
    html += '</div>';

    if (Array.isArray(d.stats) && d.stats.length > 0) {
      html += '<div class="about-stats">';
      for (var s = 0; s < d.stats.length; s++) {
        html += '<div><div class="about-stat-num">' + esc(d.stats[s].value || '0') + esc(d.stats[s].suffix || '') + '</div><div class="about-stat-lbl">' + esc(d.stats[s].label) + '</div></div>';
      }
      html += '</div>';
    }

    document.getElementById('preview-about').innerHTML = html;
  }

  function renderFeaturesGrid(d) {
    var html = '';
    if (d.eyebrow) html += '<span class="eyebrow">' + esc(d.eyebrow) + '</span>';
    if (d.heading) html += '<h2 class="section-title">' + esc(d.heading) + '</h2>';
    if (d.description) html += '<p class="section-desc">' + esc(d.description) + '</p>';
    if (Array.isArray(d.cards) && d.cards.length > 0) {
      html += '<div class="features-grid">';
      for (var i = 0; i < d.cards.length; i++) {
        html += '<div class="feature-card"><h3>' + esc(d.cards[i].heading) + '</h3><p>' + esc(d.cards[i].description) + '</p></div>';
      }
      html += '</div>';
    }
    document.getElementById('preview-features').innerHTML = html;
  }

  function renderActivitiesGrid(d) {
    var html = '';
    if (d.heading) html += '<h2 class="section-title">' + esc(d.heading) + '</h2>';
    if (d.description) html += '<p class="section-desc">' + esc(d.description) + '</p>';
    if (Array.isArray(d.cards) && d.cards.length > 0) {
      html += '<div class="activities-grid">';
      for (var i = 0; i < d.cards.length; i++) {
        var c = d.cards[i];
        html += '<div class="activity-card">';
        if (c.image) html += '<img src="' + esc(c.image) + '" alt="' + esc(c.title) + '">';
        html += '<div class="activity-card-body"><h3 class="activity-title">' + esc(c.title) + '</h3><p class="activity-desc">' + esc(c.description) + '</p>';
        if (c.linkText) html += '<a href="' + esc(c.linkUrl || '#') + '" class="activity-link">' + esc(c.linkText) + '</a>';
        html += '</div></div>';
      }
      html += '</div>';
    }
    document.getElementById('preview-activities').innerHTML = html;
  }

  function renderNewsGrid(d) {
    var html = '';
    if (d.eyebrow) html += '<span class="eyebrow">' + esc(d.eyebrow) + '</span>';
    if (d.heading) html += '<h2 class="section-title">' + esc(d.heading) + '</h2>';
    if (Array.isArray(d.cards) && d.cards.length > 0) {
      html += '<div class="news-grid">';
      for (var i = 0; i < d.cards.length; i++) {
        var c = d.cards[i];
        html += '<div class="news-card">';
        if (c.image) html += '<img src="' + esc(c.image) + '" alt="' + esc(c.title) + '">';
        html += '<div class="news-card-body"><div class="news-meta">';
        if (c.badge) html += '<span class="news-badge">' + esc(c.badge) + '</span>';
        if (c.date) html += '<span class="news-date">' + esc(c.date) + '</span>';
        html += '</div><h3>' + esc(c.title) + '</h3>';
        if (c.linkText) html += '<a href="' + esc(c.linkUrl || '#') + '" class="news-more">' + esc(c.linkText) + '</a>';
        html += '</div></div>';
      }
      html += '</div>';
    }
    document.getElementById('preview-news').innerHTML = html;
  }

  function renderCta(d) {
    var heading = d.heading || '';
    if (heading.indexOf('نشرتنا') !== -1 || heading.indexOf('اشترك') !== -1) {
      var nh = '';
      if (d.heading) nh += '<h2>' + esc(d.heading) + '</h2>';
      if (d.description) nh += '<p>' + esc(d.description) + '</p>';
      nh += '<form onsubmit="event.preventDefault()"><input type="email" placeholder="البريد الإلكتروني"><button type="submit">' + esc(d.buttonLabel || '') + '</button></form>';
      document.getElementById('preview-newsletter').innerHTML = nh;
    } else {
      var sh = '';
      if (d.heading) sh += '<div class="store-title">' + esc(d.heading).replace(/\n/g, '<br>') + '</div>';
      if (d.description) sh += '<p class="store-desc">' + esc(d.description) + '</p>';
      if (d.buttonLabel) sh += '<a href="' + esc(d.buttonUrl || '#') + '" class="store-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg><span>' + esc(d.buttonLabel) + '</span></a>';
      if (d.backgroundImage) sh += '<div class="cta-image"><img src="' + esc(d.backgroundImage) + '" alt=""></div>';
      document.getElementById('preview-store').innerHTML = sh;
    }
  }

  function renderFooter(d) {
    var html = '<div class="section-container">';
    html += '<div class="footer-brand">';
    if (d.brandLogo) html += '<img src="' + esc(d.brandLogo) + '" alt="">';
    if (d.brandName) html += '<div class="brand-name">' + esc(d.brandName) + '</div>';
    html += '</div>';
    if (d.description) html += '<div class="footer-about"><p>' + esc(d.description) + '</p></div>';
    if (d.copyright) html += '<div class="footer-bottom"><p>' + esc(d.copyright) + '</p></div>';
    html += '</div>';
    document.getElementById('preview-footer').innerHTML = html;
  }

  function dispatchSection(section) {
    if (!section || !section.enabled) return;
    var type = section.type;
    var data = section.data || {};
    var renderer = data._renderer || '';

    switch (type) {
      case 'hero': return renderHero(data);
      case 'cta': return renderCta(data);
      case 'custom':
        switch (renderer) {
          case 'about': return renderAbout(data);
          case 'featuresGrid': return renderFeaturesGrid(data);
          case 'activitiesGrid': return renderActivitiesGrid(data);
          case 'newsGrid': return renderNewsGrid(data);
          case 'footer': return renderFooter(data);
        }
        break;
      case 'statistics': return renderAbout(data);
    }
  }

  function renderAll(sections) {
    if (!Array.isArray(sections)) return;
    for (var i = 0; i < sections.length; i++) {
      dispatchSection(sections[i]);
    }
  }

  window.addEventListener('message', function(event) {
    if (event.data && event.data.type === 'preview-sections') {
      var status = event.data.status || 'draft';
      var badge = document.getElementById('statusBadge');
      badge.textContent = status === 'published' ? 'منشور' : 'مسودة';
      badge.className = 'status-badge ' + status;
      renderAll(event.data.sections);
    }
  });
</script>

</body>
</html>
